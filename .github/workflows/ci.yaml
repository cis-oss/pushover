on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Deps
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install
        run: pnpm install
      - name: Typecheck & Lint
        run: SKIP_ENV_VALIDATION=true turbo check
